name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx ng test --watch=false

      # Сайт проекта на Pages живёт по адресу /<имя репозитория>/.
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      # Pages отдаёт 404.html на неизвестные пути — так прямые ссылки попадают в Angular-роутер.
      - run: cp dist/TaxiDushanbeKhujandWebClient/browser/index.html dist/TaxiDushanbeKhujandWebClient/browser/404.html

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/TaxiDushanbeKhujandWebClient/browser
